name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.8"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Build (install deps + Django system check)
        id: build
        run: |
          pip install -r requirements.txt
          python manage.py check

      - name: Lint (ruff)
        run: |
          pip install ruff==${{ env.RUFF_VERSION }}
          ruff check --output-format=github .

      # Runs even if lint failed, so one push reports both lint and test results.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python manage.py test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Build (install deps + byte-compile)
        id: build
        run: |
          pip install -r requirements.txt
          python -m compileall -q .

      - name: Lint (ruff)
        run: |
          pip install ruff==${{ env.RUFF_VERSION }}
          ruff check --output-format=github .

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m unittest discover -s tests -v

  build-images:
    needs: [api, worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          load: true
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Scan api image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build worker image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          load: true
          tags: worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Scan worker image (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: worker:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires lowercase image names; the owner here is "MarcoGr11".
      - name: Image prefix
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Rebuilds from the layer cache written by build-images, so this is the
      # same scanned image, just pushed.
      - name: Publish api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.IMAGE }}-api:${{ github.sha }}
            ${{ env.IMAGE }}-api:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: |
            ${{ env.IMAGE }}-worker:${{ github.sha }}
            ${{ env.IMAGE }}-worker:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=worker

      - name: Verify api image (pull + run + health check)
        run: |
          docker pull "$IMAGE-api:${{ github.sha }}"
          docker run -d --name api-smoke -p 8000:8000 "$IMAGE-api:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health/ && exit 0
            sleep 1
          done
          docker logs api-smoke
          exit 1

      # The worker loops forever against Postgres, so without a DB we only check
      # that the image pulls and its code and dependencies import cleanly.
      - name: Verify worker image (pull + import)
        run: |
          docker pull "$IMAGE-worker:${{ github.sha }}"
          docker run --rm "$IMAGE-worker:${{ github.sha }}" python -c "import worker, psycopg2; print('worker image OK')"
