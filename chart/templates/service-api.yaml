apiVersion: v1
kind: Service
metadata:
  name: {{ include "booking.fullname" . }}-api
  labels:
    {{- include "booking.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "booking.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
