apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.fullname" . }}-secret
  labels:
    {{- include "booking.labels" (dict "ctx" $) | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | b64enc | quote }}
  DJANGO_SECRET_KEY: {{ required "secret.djangoSecretKey is required" .Values.secret.djangoSecretKey | b64enc | quote }}
