apiVersion: v1
kind: Pod
metadata:
  name: {{ include "booking.fullname" . }}-test-health
  labels:
    {{- include "booking.labels" (dict "ctx" $ "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          url=http://{{ include "booking.fullname" . }}-api:{{ .Values.service.port }}/api/health/
          body=$(curl -fsS --retry 5 --retry-connrefused --retry-delay 2 "$url") || exit 1
          echo "GET $url -> $body"
          echo "$body" | grep -q '"status":"ok"'
