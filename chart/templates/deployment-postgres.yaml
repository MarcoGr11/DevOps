apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booking.fullname" . }}-postgres
  labels:
    {{- include "booking.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.postgres }}
  strategy:
    type: Recreate # RWO volume: the old pod must release it before the new one starts
  selector:
    matchLabels:
      {{- include "booking.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.labels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "booking.image" (dict "ctx" $ "image" .Values.image.postgres) }}
          imagePullPolicy: {{ .Values.image.postgres.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: {{ include "booking.fullname" . }}-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: {{ include "booking.fullname" . }}-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "booking.fullname" . }}-secret, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "booking.fullname" . }}-postgres-data
          {{- else }}
          emptyDir: {}
          {{- end }}
