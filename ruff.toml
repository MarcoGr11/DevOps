target-version = "py312"
line-length = 120
src = ["api", "worker"]

# Django migrations are generated by makemigrations and rewritten on every
# model change; linting them only produces noise (e.g. RUF012 on the
# declarative `dependencies`/`operations` lists).
extend-exclude = ["**/migrations/"]

[lint.per-file-ignores]
# Model `class Meta` attributes are declarative config consumed once by
# Django's ModelBase metaclass and never mutated. Switching them to tuples
# changes migration state (makemigrations emits a new AlterModelOptions), so
# RUF012 is a false positive here.
"**/models.py" = ["RUF012"]
